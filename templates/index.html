<!DOCTYPE html>
<html>
<head>
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>🤖 Gemini Chatbot</h1>

        <form action="/chat" method="POST">

            <input
                type="text"
                name="message"
                placeholder="Ask me anything..."
                required>

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</body>
</html>
