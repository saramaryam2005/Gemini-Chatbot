<!DOCTYPE html>
<html>

<head>
    <title>Gemini Chatbot</title>
</head>

<body>

    <h1>My Gemini Chatbot</h1>

    <form action="/chat" method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type your message"
            required>

        <button type="submit">
            Send
        </button>

    </form>

</body>

</html>
